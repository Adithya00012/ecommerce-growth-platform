version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['North', 'South', 'East', 'West']

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: fact_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled']

  - name: mart_daily_revenue
    columns:
      - name: order_date
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [not_null]
