version: 2

models:
  - name: int_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: mart_new_vs_returning_monthly
    columns:
      - name: order_month
        data_tests: [unique, not_null]

  - name: mart_customer_rfm
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['Champions', 'Loyal', 'Recent', 'At Risk', 'Lost', 'Needs Attention']

  - name: mart_retention_cohorts
    columns:
      - name: cohort_month
        data_tests: [unique, not_null]

  - name: mart_cohort_matrix
    columns:
      - name: retention_pct
        data_tests: [not_null]

  - name: mart_customer_ltv
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: clv
        data_tests: [not_null]

  - name: mart_customer_churn
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: is_churned
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_repeat_purchase
    columns:
      - name: order_bucket
        data_tests: [unique, not_null]